name: Qualité et tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      LANGSMITH_TRACING: "false"
      LANGSMITH_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Installer le projet
        run: python -m pip install -e ".[dev]"
      - name: Vérifier le style
        run: ruff check src tests scripts examples
      - name: Vérifier le formatage
        run: ruff format --check src tests scripts examples
      - name: Exécuter les tests hors réseau
        run: python -m unittest discover -s tests -t . -v
      - name: Vérifier les résultats historiques
        run: python -m scripts.verifier_archives
